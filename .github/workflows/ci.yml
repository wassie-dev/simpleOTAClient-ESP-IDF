name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core-sync:
    name: Vendored core matches its commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read the core commit
        id: core
        run: echo "sha=$(cat simpleota/src/core/CORE_VERSION)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: wassie-dev/simpleOTAClient-core
          ref: ${{ steps.core.outputs.sha }}
          path: core
      - name: Compare
        run: core/scripts/sync-core.sh --check simpleota/src/core simpleota/include

  build-examples:
    name: "${{ matrix.example }} (IDF ${{ matrix.idf }}, ${{ matrix.target }}, ${{ matrix.wdt }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Every published target, from the IDF floor (5.1) to latest, on
          # Xtensa and RISC-V. Every build checks the image leaves 20 percent
          # of its app slot free. wdt: require checks that the trial watchdog
          # links wdt_hal_init; absent checks the Kconfig opt-out drops it.
          - { idf: "v5.1.4", target: esp32, example: basic, wdt: require }
          - { idf: "v5.1.4", target: esp32, example: basic, wdt: absent }
          - { idf: "v5.1.4", target: esp32, example: signed, wdt: require }
          - { idf: "v5.1.4", target: esp32, example: polling, wdt: require }
          - { idf: "v5.1.4", target: esp32c3, example: basic, wdt: require }
          - { idf: "v5.2.8", target: esp32s2, example: basic, wdt: require }
          - { idf: "v5.3.2", target: esp32, example: basic, wdt: require }
          - { idf: "v5.4.4", target: esp32c6, example: basic, wdt: require }
          - { idf: "v5.4.4", target: esp32c6, example: basic, wdt: absent }
          - { idf: "v5.4.4", target: esp32c6, example: signed, wdt: require }
          - { idf: "v5.5.5", target: esp32s3, example: basic, wdt: require }
          - { idf: "latest", target: esp32s3, example: basic, wdt: require }
          - { idf: "latest", target: esp32c3, example: basic, wdt: require }
          - { idf: "latest", target: esp32c3, example: signed, wdt: require }
          - { idf: "latest", target: esp32c3, example: polling, wdt: require }
    steps:
      # The examples resolve the in-repo component via override_path pointing
      # at the simpleota/ subdirectory, whose name matches the component name
      # (the component manager resolves local dependencies by directory
      # basename), so no special checkout path is needed.
      - uses: actions/checkout@v4
      - name: Build example
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: ${{ matrix.idf }}
          target: ${{ matrix.target }}
          path: examples/${{ matrix.example }}
          command: bash ../../.github/ci_build.sh ${{ matrix.wdt }}
