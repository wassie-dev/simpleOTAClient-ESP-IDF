name: Release

# Mirrors SimpleOTAClient-Arduino's release flow: merging to main with a
# bumped version IS the release. Fires only after the "CI" workflow (host
# tests + the full example build matrix) completes SUCCESSFULLY on main,
# then:
#   1. reads version: from simpleota/idf_component.yml,
#   2. if tag v<version> does not exist, creates the tag + GitHub Release
#      from the exact commit CI validated,
#   3. uploads the component to the Espressif Component Registry in the
#      same job. (The registry upload cannot live behind a `release:
#      published` trigger here: releases created with the default
#      GITHUB_TOKEN deliberately do not trigger other workflows.)
#
# Idempotent: pushes that do not bump the version find the tag already
# present and skip both steps. Registry versions are immutable, so a
# version is only ever uploaded once, and only after green CI.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: write

jobs:
  release:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Release exactly the commit CI validated, not a possibly-newer main.
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0 # full history so existing tags are visible

      - name: Read component version and check for existing tag
        id: version
        run: |
          set -euo pipefail
          VERSION=$(sed -n 's/^version: *"\([^"]*\)".*/\1/p' simpleota/idf_component.yml)
          if [ -z "$VERSION" ]; then
            echo "::error::could not read version from simpleota/idf_component.yml"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "Tag v$VERSION already exists; nothing to release."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub release
        if: steps.version.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.event.workflow_run.head_sha }}
          generate_release_notes: true

      - name: Upload to Espressif Component Registry
        if: steps.version.outputs.exists == 'false'
        uses: espressif/upload-components-ci-action@v1
        with:
          directories: simpleota
          name: simpleota
          namespace: wassie-dev
          api_token: ${{ secrets.IDF_COMPONENT_API_TOKEN }}
